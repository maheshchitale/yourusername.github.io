    <style>
        
        /* Developer-themed page background shared by all pages */
body {
    background-color: #FEFAFA;
    background-image: url("dev-hero.svg"), url("dev-pattern.svg");
    background-repeat: no-repeat, repeat;
    background-position: top center, 0 0;
    background-size: 100% 560px, 400px 400px;
}

/* keep text over the pattern easy to read */
footer {
    background-color: rgba(254, 250, 250, 0.9);
    margin-top: 3rem;
    padding-bottom: 1rem;
}

@media (max-width: 767px) {
    body {
        background-size: auto 420px, 300px 300px;
    }
}
        /* ===== Navbar ===== */
header .nav-pills {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(8, 47, 95, 0.12);
    border-radius: 50rem;
    padding: 6px;
    gap: 4px;
    box-shadow: 0 8px 24px rgba(8, 47, 95, 0.12);
}

header .nav-pills .nav-link {
    color: #082F5F;
    font-weight: 500;
    border-radius: 50rem;
    padding: 9px 18px;
    transition: background-color .25s ease, color .25s ease, transform .25s ease;
}

header .nav-pills .nav-link:hover {
    background-color: #dcebfb;
    color: #082F5F;
    transform: translateY(-1px);
}

/* active page */
header .nav-pills .nav-link.active {
    background: linear-gradient(135deg, #082F5F 0%, #1b66b8 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(8, 47, 95, 0.35);
}

header .nav-pills .nav-link:focus-visible {
    outline: 3px solid #74c0fc;
    outline-offset: 2px;
}

/* Hire me button */
header .btn-hire {
    background: linear-gradient(135deg, #d31818, #f0523c);
    color: #fff;
    border: 0;
    border-radius: 50rem;
    padding: 11px 28px;
    font-weight: 500;
    box-shadow: 0 6px 16px rgba(211, 24, 24, 0.3);
    transition: transform .25s ease, box-shadow .25s ease;
}

header .btn-hire:hover {
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(211, 24, 24, 0.4);
}

header .btn-hire:focus-visible {
    outline: 3px solid #74c0fc;
    outline-offset: 2px;
}

/* small screens: button on top, full-width nav below */
@media (max-width: 767px) {
    header .row > .col-3:first-child { display: none; }
    header .row > .col-6 { flex: 0 0 100%; width: 100%; order: 2; margin-top: 14px; }
    header .row > .col-3.text-center { flex: 0 0 100%; width: 100%; order: 1; }
    header .nav-pills { flex-wrap: wrap; }
    header .nav-pills .nav-link { padding: 8px 12px; font-size: 14px; }
}
        body {

        }
        
        .img-fluid{
            
            width: 80%;

        }
    </style>
